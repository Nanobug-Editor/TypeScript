[package]
name = "nanobug-typescript-guest"
version = "0.1.15"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The selected Nanobug executable supplies this SDK through --plugin-cargo.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
# Persisted preference names use a fixed digest format across compiler/toolchain versions.
sha2 = "=0.10.9"
